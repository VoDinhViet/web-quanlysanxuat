# Compose file for the test environment (staging) on the VPS (/opt/qlsx-staging-web/). CI copies it there together
# with remote-deploy.sh. Independent from production (/opt/qlsx-web): own project, container and port.
# Staging shares RAM with production, so the container has a memory limit and a high `oom_score_adj`: when the
# host runs out of memory the kernel kills staging first.
#
# Values come from /opt/qlsx-staging-web/.env on the VPS:
#   SESSION_SECRET  required, a long random string, different from production (openssl rand -hex 32)
#   WEB_IMAGE       written by remote-deploy.sh after every successful deploy

name: qlsx-staging-web

services:
  web:
    container_name: qlsx-staging-frontend
    image: ${WEB_IMAGE:-ghcr.io/vodinhviet/web-quanlysanxuat:staging}
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in /opt/qlsx-staging-web/.env}
      NODE_ENV: production
      # Optional Ask (ai-platform) bubble; empty AI_PLATFORM_URL turns it off.
      AI_PLATFORM_URL: ${AI_PLATFORM_URL:-}
      AI_PLATFORM_EMBED_APP_ID: ${AI_PLATFORM_EMBED_APP_ID:-}
      AI_PLATFORM_EMBED_APP_KEY: ${AI_PLATFORM_EMBED_APP_KEY:-}
    mem_limit: 200m
    oom_score_adj: 500
    # Loopback only: Caddy terminates HTTPS and proxies to 127.0.0.1:3010.
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    healthcheck:
      # Any non-5xx answer from /login counts as healthy.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 3s
